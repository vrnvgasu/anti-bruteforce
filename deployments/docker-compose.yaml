version: '3.8'
name: 'anti-bruteforce'

services:
  antibruteforce:
    build:
      dockerfile: ./build/Dockerfile_app
      context: ../
      args:
        SOURCE_CONFIG_FILE: ${SOURCE_CONFIG_FILE:-./configs/app-dev.yml}
    ports:
      - "50051:50051"
    depends_on:
      - redis
    restart: on-failure
    networks:
      - anti-bruteforce-network
  redis:
    image: redis:7
    restart: always
    container_name: redis-${COMPOSE_PROJECT_NAME}
    networks:
      - anti-bruteforce-network
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli","ping" ]
      interval: 30s
      timeout: 10s
      retries: 10
    volumes:
      - ./../data/redis:/usr/local/etc/redis/redis.conf

networks:
  anti-bruteforce-network:
    driver: bridge